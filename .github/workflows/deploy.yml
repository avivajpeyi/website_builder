name: Deploy website to GitHub Pages repo

env:
  NODE_VERSION: '20'
  HUGO_CACHEDIR: /tmp/hugo_cache_runner/

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  build-deploy:
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        if: hashFiles('package.json') != ''
        uses: pnpm/action-setup@v4

      - name: Get Hugo Version
        run: |
          VERSION=$(grep "hugo_version" hugoblox.yaml | awk '{print $2}' | tr -d "'\"")
          echo "HUGO_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          if [ -f "package.json" ]; then
            echo "Installing Tailwind dependencies..."
            pnpm install --no-frozen-lockfile || npm install
          fi

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Get Go module cache path
        id: go-cache-path
        run: echo "path=$(go env GOMODCACHE)" >> $GITHUB_OUTPUT

      - name: Cache Hugo modules
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.go-cache-path.outputs.path }}
            /tmp/hugo_cache_runner/
          key: ${{ runner.os }}-hugo-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugo-mod-

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: node_modules/
          key: ${{ runner.os }}-node-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: resources/
          key: ${{ runner.os }}-hugo-resources-${{ hashFiles('assets/**/*', 'config/**/*', 'data/**/*') }}
          restore-keys: |
            ${{ runner.os }}-hugo-resources-

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_BLOX_LICENSE: ${{ secrets.HUGO_BLOX_LICENSE }}
          HUGO_CACHEDIR: ${{ env.HUGO_CACHEDIR }}
        run: |
          echo "Hugo Cache Dir: $(hugo config | grep cachedir)"
          hugo --minify

      - name: Generate Pagefind search index (if applicable)
        run: |
          if [ -f "package.json" ] && grep -q "pagefind" package.json; then
            pnpm run pagefind || npx pagefind --site "public"
          fi

      - name: Deploy to avivajpeyi.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEST_REPO_TOKEN }}
          external_repository: avivajpeyi/avivajpeyi.github.io
          publish_branch: main
          publish_dir: ./public

# Hugo Blox GitHub Action to convert Bibtex publications to Markdown-based webpages
name: Import Publications From Bibtex

# Require permission to create and merge generated publication PRs.
permissions:
  contents: write
  pull-requests: write

# Run when the reviewed bibliography changes.
on:
  push:
    branches: ['main']
    paths: ['publications.bib', 'scripts/import_publications.py', 'scripts/postprocess_publications.py']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Prevent concurrent runs of this workflow
concurrency:
  group: import-publications-${{ github.ref }}
  # Let a successful merge reach the deployment dispatch before another run starts.
  cancel-in-progress: false

jobs:
  hugoblox:
    if: github.repository_owner != 'HugoBlox' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
      pull-request-head-sha: ${{ steps.cpr.outputs.pull-request-head-sha }}
      pull-request-operation: ${{ steps.cpr.outputs.pull-request-operation }}

    env:
      ACADEMIC_VERSION: '==0.11.2'
      PYTHON_VERSION: '3.12'
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
        with:
          # Fetch-depth 1 for faster checkout during publication import
          fetch-depth: 1

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-academic-${{ env.ACADEMIC_VERSION }}
          restore-keys: |
            ${{ runner.os }}-pip-academic-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "academic${{ env.ACADEMIC_VERSION }}" pyyaml
      - name: Validate publications.bib file
        if: ${{ hashFiles('publications.bib') != '' }}
        run: |
          if [ ! -f "publications.bib" ]; then
            echo "❌ publications.bib file not found"
            exit 1
          fi
          echo "✅ publications.bib file found"
          
      - name: Run Academic (Bibtex To Markdown Converter)
        # Check `.bib` file exists for case when action runs on `.bib` deletion
        # Note GH only provides hashFiles func in `steps.if` context, not `jobs.if` context
        if: ${{ hashFiles('publications.bib') != '' }}
        run: |
          echo "🚀 Starting publication import..."
          python scripts/import_publications.py
          echo "✅ Publication import completed successfully"
          
          # Verify that files were created
          if [ -d "content/publication" ] && [ "$(ls -A content/publication/)" ]; then
            echo "📚 Publications imported: $(ls content/publication/ | wc -l) items"
          else
            echo "⚠️ No publications were imported"
          fi
        continue-on-error: false
      - name: Post-process publications
        if: ${{ hashFiles('publications.bib') != '' }}
        run: |
          python scripts/postprocess_publications.py
      - name: Create Pull Request
        # Set ID for `Check outputs` stage
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: |
            content/publication/
            static/uploads/publications.bib
          commit-message: 'feat(publications): import latest publications from bibtex'
          title: 'HugoBlox Kit - Import latest publications from Bibtex'
          body: |
            🔄 **Automated Publication Import**

            This PR automatically imports the latest publications from `publications.bib` to `content/publication/`.

            The import workflow builds the website, merges this PR on success,
            and starts deployment automatically.

            **Changes:**
            - 📚 Updated publication entries
            - 🏷️ Processed bibliographic data

            ---
            将最新的出版物从`publications.bib`导入到`content/publication/`。

            📖 [View Documentation](https://github.com/GetRD/academic-file-converter)
          base: main
          labels: automated-pr, content, publications
          branch: hugoblox-import-publications
          delete-branch: true
          draft: false
      - name: Check outputs
        if: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          echo "✅ Successfully created Pull Request!"
          echo "📝 Pull Request Number - ${{ steps.cpr.outputs.pull-request-number }}"
          echo "🔗 Pull Request URL - ${{ steps.cpr.outputs.pull-request-url }}"
          echo "🎯 Operation completed at $(date)"

      - name: Report workflow status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "🎉 Workflow completed successfully"
          else
            echo "❌ Workflow failed - check logs for details"
            exit 1
          fi

  validate-and-merge:
    needs: hugoblox
    if: >-
      needs.hugoblox.outputs.pull-request-number != '' &&
      needs.hugoblox.outputs.pull-request-operation != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ needs.hugoblox.outputs.pull-request-number }}
      PR_HEAD_SHA: ${{ needs.hugoblox.outputs.pull-request-head-sha }}
      HUGO_CACHEDIR: /tmp/hugo_cache_runner
    steps:
      - name: Check out the generated PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.hugoblox.outputs.pull-request-head-sha }}
          fetch-depth: 0

      - name: Verify only generated publication pages changed
        run: git diff --exit-code origin/main...HEAD -- . ':!content/publication/' ':!static/uploads/publications.bib'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get Hugo Version
        run: |
          VERSION=$(awk '/hugo_version:/ {gsub(/[\047\042]/, "", $2); print $2}' hugoblox.yaml)
          echo "HUGO_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Install website dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and build the generated website
        env:
          HUGO_ENVIRONMENT: production
          HUGO_BLOX_LICENSE: ${{ secrets.HUGO_BLOX_LICENSE }}
        run: |
          npm run lint
          npm run build

      - name: Merge the validated publication import
        run: gh pr merge "$PR_NUMBER" --squash --match-head-commit "$PR_HEAD_SHA"

      # A merge using GITHUB_TOKEN does not trigger the normal push workflow.
      - name: Deploy the merged website
        run: gh workflow run deploy.yml --ref main

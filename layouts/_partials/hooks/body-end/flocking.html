{{ if .IsHome }}
  <script>
    (function () {
      if (!window.p5) {
        return;
      }

      const motionQuery = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
      if (motionQuery && motionQuery.matches) {
        return;
      }

      const sectionConfigs = [
        {
          selector: '.hero-flocking',
          containerId: 'flocking-hero',
          countFor: (width, height) => {
            const area = Math.max(1, width) * Math.max(1, height);
            const base = Math.round(area / 12000);
            return Math.max(56, Math.min(118, base));
          },
          palette: ['#ff7a18', '#ffb347', '#ffd166', '#f7678a', '#5bc0eb'],
          maxSpeed: [1.2, 2.3],
          tailLength: [4.5, 7],
          targetInfluence: 0.75,
        },
        {
          selector: '.contact-walkers',
          containerId: 'flocking-contact',
          countFor: (width, height) => {
            const area = Math.max(1, width) * Math.max(1, height);
            const base = Math.round(area / 14000);
            return Math.max(42, Math.min(90, base));
          },
          palette: ['#5bc0eb', '#ffd166', '#f7678a', '#ff9f68'],
          maxSpeed: [1.1, 2.0],
          tailLength: [4, 6.5],
          targetInfluence: 0.65,
        },
      ];

      const createBoidSketch = (section, container, config) => {
        const sketch = (p) => {
          const perception = {
            align: 46,
            cohesion: 60,
            separation: 26,
          };
          const gridSize = perception.cohesion;

          let boids = [];
          let bounds = { w: 1, h: 1 };
          let pointer = null;
          let isAttracting = false;
          let pointerListenerAttached = false;
          let grid = new Map();
          let resizeObserver = null;

          const keyFor = (x, y) => `${x},${y}`;

          const neighborBoidsFor = (boid) => {
            const cellX = Math.floor(boid.position.x / gridSize);
            const cellY = Math.floor(boid.position.y / gridSize);
            const neighbors = [];
            for (let gx = cellX - 1; gx <= cellX + 1; gx += 1) {
              for (let gy = cellY - 1; gy <= cellY + 1; gy += 1) {
                const cell = grid.get(keyFor(gx, gy));
                if (cell) {
                  neighbors.push(...cell);
                }
              }
            }
            return neighbors;
          };

          class Boid {
            constructor() {
              this.position = p.createVector(p.random(bounds.w), p.random(bounds.h));
              const angle = p.random(p.TWO_PI);
              this.velocity = p.createVector(Math.cos(angle), Math.sin(angle));
              this.velocity.setMag(p.random(0.55, 1.8));
              this.acceleration = p.createVector();
              this.maxForce = 0.045;
              this.maxSpeed = p.random(config.maxSpeed[0], config.maxSpeed[1]);
              this.size = p.random(1.1, 2.3);
              this.tailLength = p.random(config.tailLength[0], config.tailLength[1]);
              const stroke = p.color(config.palette[Math.floor(p.random(config.palette.length))]);
              stroke.setAlpha(section.matches('.contact-walkers') ? 140 : 168);
              this.stroke = stroke;
            }

            edges() {
              if (this.position.x > bounds.w) this.position.x = 0;
              if (this.position.x < 0) this.position.x = bounds.w;
              if (this.position.y > bounds.h) this.position.y = 0;
              if (this.position.y < 0) this.position.y = bounds.h;
            }

            align(neighbors) {
              const steering = p.createVector();
              let total = 0;
              for (const other of neighbors) {
                if (other === this) continue;
                const d = p.dist(this.position.x, this.position.y, other.position.x, other.position.y);
                if (d < perception.align) {
                  steering.add(other.velocity);
                  total += 1;
                }
              }
              if (total > 0) {
                steering.div(total);
                steering.setMag(this.maxSpeed);
                steering.sub(this.velocity);
                steering.limit(this.maxForce);
              }
              return steering;
            }

            cohesion(neighbors) {
              const steering = p.createVector();
              let total = 0;
              for (const other of neighbors) {
                if (other === this) continue;
                const d = p.dist(this.position.x, this.position.y, other.position.x, other.position.y);
                if (d < perception.cohesion) {
                  steering.add(other.position);
                  total += 1;
                }
              }
              if (total > 0) {
                steering.div(total);
                steering.sub(this.position);
                steering.setMag(this.maxSpeed);
                steering.sub(this.velocity);
                steering.limit(this.maxForce);
              }
              return steering;
            }

            separation(neighbors) {
              const steering = p.createVector();
              let total = 0;
              for (const other of neighbors) {
                if (other === this) continue;
                const d = p.dist(this.position.x, this.position.y, other.position.x, other.position.y);
                if (d > 0 && d < perception.separation) {
                  const diff = p.createVector(
                    this.position.x - other.position.x,
                    this.position.y - other.position.y
                  );
                  diff.div(d * d);
                  steering.add(diff);
                  total += 1;
                }
              }
              if (total > 0) {
                steering.div(total);
                steering.setMag(this.maxSpeed);
                steering.sub(this.velocity);
                steering.limit(this.maxForce * 1.05);
              }
              return steering;
            }

            seek(target) {
              const desired = p.createVector(target.x - this.position.x, target.y - this.position.y);
              const distance = desired.mag();
              if (distance === 0) return p.createVector();
              desired.setMag(this.maxSpeed);
              const steering = desired.sub(this.velocity);
              const slowDownRadius = 140;
              if (distance < slowDownRadius) {
                steering.mult(p.map(distance, 0, slowDownRadius, 0.25, 1));
              }
              steering.limit(this.maxForce * 1.2);
              return steering;
            }

            repel(target) {
              const desired = p.createVector(this.position.x - target.x, this.position.y - target.y);
              const distance = desired.mag();
              if (distance === 0 || distance > 170) return p.createVector();
              desired.setMag(this.maxSpeed);
              const steering = desired.sub(this.velocity);
              steering.limit(this.maxForce * 1.35);
              return steering;
            }

            flock(target) {
              const neighbors = neighborBoidsFor(this);
              this.acceleration.add(this.align(neighbors).mult(1.0));
              this.acceleration.add(this.cohesion(neighbors).mult(0.82));
              this.acceleration.add(this.separation(neighbors).mult(1.4));
              if (target && target.mode === 'repel') {
                this.acceleration.add(this.repel(target).mult(config.targetInfluence));
              }
              if (target && target.mode === 'attract') {
                this.acceleration.add(this.seek(target).mult(config.targetInfluence * 0.75));
              }
            }

            update() {
              this.velocity.add(this.acceleration);
              this.velocity.limit(this.maxSpeed);
              this.position.add(this.velocity);
              this.acceleration.mult(0);
            }

            render() {
              const tail = this.velocity.copy().mult(-this.tailLength);
              p.stroke(this.stroke);
              p.strokeWeight(this.size);
              p.line(this.position.x, this.position.y, this.position.x + tail.x, this.position.y + tail.y);
            }
          }

          const rebuildGrid = () => {
            grid = new Map();
            for (const boid of boids) {
              const cellX = Math.floor(boid.position.x / gridSize);
              const cellY = Math.floor(boid.position.y / gridSize);
              const key = keyFor(cellX, cellY);
              if (!grid.has(key)) {
                grid.set(key, []);
              }
              grid.get(key).push(boid);
            }
          };

          const seedBoids = (count) => {
            boids = [];
            for (let i = 0; i < count; i += 1) {
              boids.push(new Boid());
            }
            rebuildGrid();
          };

          const adjustBoids = (count) => {
            if (count > boids.length) {
              for (let i = boids.length; i < count; i += 1) {
                boids.push(new Boid());
              }
            } else if (count < boids.length) {
              boids.length = count;
            }
            rebuildGrid();
          };

          const resize = (width, height) => {
            bounds = {
              w: Math.max(1, Math.floor(width)),
              h: Math.max(1, Math.floor(height)),
            };
            p.resizeCanvas(bounds.w, bounds.h);
            adjustBoids(config.countFor(bounds.w, bounds.h));
          };

          const updatePointer = (event) => {
            const rect = section.getBoundingClientRect();
            const touch = event.touches && event.touches[0];
            const clientX = touch ? touch.clientX : event.clientX;
            const clientY = touch ? touch.clientY : event.clientY;
            const x = clientX - rect.left;
            const y = clientY - rect.top;
            if (x >= 0 && x <= rect.width && y >= 0 && y <= rect.height) {
              pointer = { x, y, mode: isAttracting ? 'attract' : 'repel' };
            } else {
              pointer = null;
            }
          };

          const clearPointer = () => {
            pointer = null;
          };

          p.setup = () => {
            const rect = section.getBoundingClientRect();
            bounds = {
              w: Math.max(1, Math.floor(rect.width)),
              h: Math.max(1, Math.floor(rect.height)),
            };
            const canvas = p.createCanvas(bounds.w, bounds.h);
            canvas.parent(container);
            p.pixelDensity(1);
            p.frameRate(30);
            p.clear();
            seedBoids(config.countFor(bounds.w, bounds.h));

            if (!pointerListenerAttached) {
              window.addEventListener('mousemove', updatePointer, { passive: true });
              window.addEventListener('touchmove', updatePointer, { passive: true });
              window.addEventListener('touchstart', updatePointer, { passive: true });
              section.addEventListener('mouseleave', clearPointer, { passive: true });
              section.addEventListener('pointerdown', () => {
                isAttracting = true;
                if (pointer) pointer.mode = 'attract';
              });
              window.addEventListener('pointerup', () => {
                isAttracting = false;
                if (pointer) pointer.mode = 'repel';
              });
              pointerListenerAttached = true;
            }

            if (window.ResizeObserver) {
              resizeObserver = new ResizeObserver((entries) => {
                if (!entries.length) return;
                const { width, height } = entries[0].contentRect;
                resize(width, height);
              });
              resizeObserver.observe(section);
            } else {
              window.addEventListener('resize', () => {
                const nextRect = section.getBoundingClientRect();
                resize(nextRect.width, nextRect.height);
              });
            }
          };

          p.draw = () => {
            p.clear();
            rebuildGrid();
            for (const boid of boids) {
              boid.flock(pointer);
              boid.update();
              boid.edges();
              boid.render();
            }
          };

        };

        return new window.p5(sketch, container);
      };

      for (const config of sectionConfigs) {
        const section = document.querySelector(config.selector);
        if (!section || document.getElementById(config.containerId)) {
          continue;
        }

        const container = document.createElement('div');
        container.id = config.containerId;
        container.setAttribute('aria-hidden', 'true');
        section.prepend(container);

        if (getComputedStyle(section).position === 'static') {
          section.style.position = 'relative';
        }

        createBoidSketch(section, container, config);
      }
    })();
  </script>
{{ end }}
